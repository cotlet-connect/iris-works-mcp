[project]
name = "iris-works-mcp"
version = "1.1.0"
description = "Connect Iris Works to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No Iris Works API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["iris works", "iris works api", "iris works mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/iris-works-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=iris-works"
Source = "https://github.com/cotlet-connect/iris-works-mcp"

[project.scripts]
iris-works-mcp = "iris_works_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"iris_works_agent.py" = "iris_works_agent.py"

[tool.hatch.build.targets.sdist]
include = ["iris_works_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
